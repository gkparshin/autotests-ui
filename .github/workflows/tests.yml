name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
      branches:
        - main
jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=./allure-results --numprocesses 2 --reruns 2 --reruns-delay 2

      - name: Upload Allure results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Download Allure results
        uses: actions/download-artifact@v3
        if: always()
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v3
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Allure CLI
        if: always()
        run: |
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -zxf allure.tgz

      - name: Copy Allure history from gh-pages
        if: always()
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results && cp -r gh-pages/history allure-results/history
          fi

      - name: Remove large attachments
        if: always()
        run: |
          if [ -d allure-results ]; then
            find allure-results \( -name "*.zip" -o -name "*.webm" \) -size +50M -delete || true
          fi

      - name: Generate Allure report
        if: always()
        run: ./allure-2.30.0/bin/allure generate allure-results --clean -o site

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: site
